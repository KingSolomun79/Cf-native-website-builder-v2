<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .container { text-align: center; max-width: 480px; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #525252; margin-bottom: 2rem; line-height: 1.6; }
    a { display: inline-block; padding: 0.75rem 2rem; background: #000; color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border: 2px solid #000; }
    a:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Message Sent</h1>
    <p>Thank you for your message. We will be in touch shortly.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
